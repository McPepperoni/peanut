name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pure:
    name: pure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify llama.cpp pin
        shell: bash
        run: test "$(git -C third-party/llama.cpp rev-parse HEAD)" = "a894dae939d426954ce54bb604824f1ae918a0c5"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  linux-arm64-compile:
    name: compile (linux/arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify llama.cpp pin
        shell: bash
        run: test "$(git -C third-party/llama.cpp rev-parse HEAD)" = "a894dae939d426954ce54bb604824f1ae918a0c5"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Compile ARM64 test binaries
        run: go test ./... -run '^$' -exec true
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify llama.cpp pin
        shell: bash
        run: test "$(git -C third-party/llama.cpp rev-parse HEAD)" = "a894dae939d426954ce54bb604824f1ae918a0c5"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Build
        shell: bash
        run: |
          mkdir -p ../build
          go build -o "../build/peanut-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/peanut
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
