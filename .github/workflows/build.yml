name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    name: pure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  linux-arm64-compile:
    name: compile (linux/arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Compile ARM64 test binaries
        run: go test ./... -run '^$' -exec true
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
