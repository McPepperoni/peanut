name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: peanut-linux-amd64
            native: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: peanut-linux-arm64
            native: true
          - runner: windows-latest
            goos: windows
            goarch: amd64
            artifact: peanut-windows-amd64.exe
            native: false
          - runner: macos-14
            goos: darwin
            goarch: arm64
            artifact: peanut-darwin-arm64
            native: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify llama.cpp pin
        shell: bash
        run: test "$(git -C third-party/llama.cpp rev-parse HEAD)" = "a894dae939d426954ce54bb604824f1ae918a0c5"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Configure native llama.cpp
        if: matrix.native
        shell: bash
        run: |
          cmake -S third-party/llama.cpp -B build/llama/${{ matrix.goarch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_HIP=OFF \
            -DGGML_OPENCL=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build/llama/${{ matrix.goarch }} --config Release --parallel
      - name: Build native Linux artifact
        if: matrix.native
        shell: bash
        working-directory: app
        run: go build -tags peanut_llama -o "../${{ matrix.artifact }}" ./cmd/peanut
      - name: Build stub artifact
        if: '!matrix.native'
        shell: bash
        working-directory: app
        run: go build -o "../${{ matrix.artifact }}" ./cmd/peanut
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
