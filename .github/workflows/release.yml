name: release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  validate:
    name: validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate release version
        id: release
        run: bun run release:validate

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: peanut-linux-amd64
            native: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: peanut-linux-arm64
            native: true
          - runner: windows-latest
            goos: windows
            goarch: amd64
            artifact: peanut-windows-amd64.exe
            native: false
          - runner: macos-14
            goos: darwin
            goarch: arm64
            artifact: peanut-darwin-arm64
            native: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify llama.cpp pin
        shell: bash
        run: test "$(git -C third-party/llama.cpp rev-parse HEAD)" = "a894dae939d426954ce54bb604824f1ae918a0c5"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum
      - name: Configure native llama.cpp
        if: matrix.native
        shell: bash
        run: |
          ./tools/build-llama.sh "${{ matrix.goarch }}"
      - name: Build native Linux artifact
        if: matrix.native
        shell: bash
        working-directory: app
        run: go build -tags peanut_llama -o "../${{ matrix.artifact }}" ./cmd/peanut
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I${{ github.workspace }}/build/llama/${{ matrix.goarch }}/prefix/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/build/llama/${{ matrix.goarch }}/prefix/lib"
      - name: Build stub artifact
        if: '!matrix.native'
        shell: bash
        working-directory: app
        run: go build -o "../${{ matrix.artifact }}" ./cmd/peanut
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: peanut-*
          path: release
          merge-multiple: true
      - name: Verify release artifacts
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          for artifact in peanut-linux-amd64 peanut-linux-arm64 peanut-windows-amd64.exe peanut-darwin-arm64; do
            test -s "$artifact"
          done
      - name: Create checksums
        shell: bash
        working-directory: release
        run: sha256sum peanut-linux-amd64 peanut-linux-arm64 peanut-windows-amd64.exe peanut-darwin-arm64 > SHA256SUMS
      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${{ needs.validate.outputs.tag }}" \
            release/peanut-linux-amd64 \
            release/peanut-linux-arm64 \
            release/peanut-windows-amd64.exe \
            release/peanut-darwin-arm64 \
            release/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "Peanut ${{ needs.validate.outputs.tag }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
